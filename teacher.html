<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المدرس | مسارك التعليمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // حماية الصفحة فورياً قبل الرندر لتجنب الوميض المظهري
        if(!localStorage.getItem('currentUser')) {
            window.location.href = "login.html";
        }
    </script>
    <style>
        /* التنسيقات العامة والـ Minimal */
        :root[data-theme="dark"] { --bg-base:#0a0a0c; --bg-surface:#121216; --border-color:rgba(255,255,255,0.06); --text-main:#f3f4f6; --text-muted:#9ca3af; --accent:#3b82f6; --accent-glow:rgba(59,130,246,0.15); }
        :root[data-theme="light"] { --bg-base:#f8f9fa; --bg-surface:#ffffff; --border-color:rgba(0,0,0,0.06); --text-main:#1a1a1e; --text-muted:#6c757d; --accent:#228be6; --accent-glow:rgba(34,139,230,0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); }
        .container { width: 90%; max-width: 1000px; margin: 0 auto; }
        nav { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); height: 70px; display: flex; align-items: center; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        /* البروفايل الداخلي */
        .profile-header { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; margin: 40px 0; display: flex; align-items: center; gap: 30px; }
        .prof-img { width: 120px; height: 120px; border-radius: 18px; object-fit: cover; }
        .prof-info h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; }
        .prof-subject { background: var(--accent-glow); color: var(--accent); padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 10px; }
        .prof-bio { color: var(--text-muted); font-size: 0.9rem; }

        /* تابات الأقسام المقسمة */
        .tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 25px; padding-bottom: 5px; overflow-x: auto; }
        .tab-btn { background: none; border: none; padding: 10px 20px; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--text-main); border-bottom: 2px solid var(--accent); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .item-card { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .item-meta h4 { font-size: 1rem; font-weight: 700; }
        .item-meta span { font-size: 0.8rem; color: var(--text-muted); }
        .btn-action { padding: 8px 16px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; }
        
        .announcement-card { background: var(--accent-glow); border-right: 4px solid var(--accent); padding: 15px 20px; border-radius: 8px; margin-bottom: 12px; color: var(--text-main); }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-wrapper">
            <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> مسارك التعليمي</a>
            <ul class="nav-links" style="display:flex; gap:20px; list-style:none;">
                <li><a href="index.html" style="text-decoration:none; color:var(--text-muted);">الرئيسية</a></li>
                <li><a href="teachers.html" style="text-decoration:none; color:var(--text-main);">المدرسون</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="profile-header" id="profile-header-area">
            </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'lectures')"><i class="fa-solid fa-play"></i> المحاضرات</button>
            <button class="tab-btn" onclick="switchTab(event, 'pdfs')"><i class="fa-solid fa-file-pdf"></i> الملازم PDF</button>
            <button class="tab-btn" onclick="switchTab(event, 'exams')"><i class="fa-solid fa-spell-check"></i> الامتحانات</button>
            <button class="tab-btn" onclick="switchTab(event, 'assignments')"><i class="fa-solid fa-pen-clip"></i> الواجبات</button>
            <button class="tab-btn" onclick="switchTab(event, 'announcements')"><i class="fa-solid fa-bullhorn"></i> الإعلانات</button>
        </div>

        <div id="lectures" class="tab-content active"></div>
        <div id="pdfs" class="tab-content"></div>
        <div id="exams" class="tab-content"></div>
        <div id="assignments" class="tab-content"></div>
        <div id="announcements" class="tab-content"></div>
    </main>

    <script>
        // الداتا الحصرية والمحمية داخل صفحة المدرس فقط
        const teacherDb = {
            t1: {
                name: "أ. محمود عبد العزيز", subject: "اللغة العربية", img: "https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200", bio: "خبير وموجه أول اللغة العربية المعتمد للثاني بكالوريا.",
                lectures: [{title: "محاضرة 1: مدرسة إحياء الرمز والتقليد الشامل", info: "المدة: 50 دقيقة"}],
                pdfs: [{title: "ملخص ظاهرة الشعر الحديث المعتمد.pdf", info: "الحجم: 3.4 ميجا"}],
                exams: [{title: "الامتحان التجريبي الأول للغة العربية", info: "الوقت: 45 دقيقة"}],
                assignments: [{title: "واجب تحليلي: قصيدة من المدرسة الإحيائية", info: "آخر موعد تسليم: السبت"}],
                announcements: ["سيتم رفع الفيديو التوضيحي الشامل للمنهج غداً عصراً."]
            }
        };

        // استخراج الـ ID من الرابط والتشغيل المعزول
        const params = new URLSearchParams(window.location.search);
        const tId = params.get('id') || 't1';
        const teacher = teacherDb[tId] || teacherDb['t1'];

        document.getElementById('profile-header-area').innerHTML = `
            <img src="${teacher.img}" class="prof-img">
            <div class="prof-info">
                <span class="prof-subject">${teacher.subject}</span>
                <h2>${teacher.name}</h2>
                <p class="prof-bio">${teacher.bio}</p>
            </div>
        `;

        // دالة رندر المحتوى الداخلي الخاص بالمدرس
        function renderContent(target, data, icon, actionText) {
            const div = document.getElementById(target);
            if(data.length === 0) { div.innerHTML = `<p style="color:var(--text-muted);">لا يوجد محتوى متوفر حالياً.</p>`; return; }
            data.forEach(item => {
                if(target === 'announcements') {
                    div.innerHTML += `<div class="announcement-card"><p>${item}</p></div>`;
                } else {
                    div.innerHTML += `
                        <div class="item-card">
                            <div class="item-meta">
                                <h4><i class="${icon}" style="color:var(--accent); margin-left:8px;"></i> ${item.title}</h4>
                                <span>${item.info}</span>
                            </div>
                            <button class="btn-action" onclick="alert('طلبك برمجياً قيد المعالجة الآن!')">${actionText}</button>
                        </div>
                    `;
                }
            });
        }

        renderContent('lectures', teacher.lectures, 'fa-solid fa-circle-play', 'مشاهدة الفيديو');
        renderContent('pdfs', teacher.pdfs, 'fa-solid fa-file-arrow-down', 'تحميل PDF');
        renderContent('exams', teacher.exams, 'fa-solid fa-file-signature', 'دخول الاختبار');
        renderContent('assignments', teacher.assignments, 'fa-solid fa-upload', 'تسليم الحل');
        renderContent('announcements', teacher.announcements);

        function switchTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
